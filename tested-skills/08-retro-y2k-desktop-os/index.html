<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIBE-OS // Millennium 1999 Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'MS Sans Serif', Tahoma, sans-serif; font-size: 11px; }
    body { background: #008080; height: 100vh; overflow: hidden; user-select: none; }

    /* Desktop Icons */
    .desktop-icons { padding: 20px; display: flex; flex-direction: column; gap: 24px; }
    .icon { width: 64px; text-align: center; color: #fff; cursor: pointer; }
    .icon-img { width: 32px; height: 32px; margin: 0 auto 4px; display: grid; place-items: center; font-size: 20px; }

    /* Windows 98 Style Windows */
    .win98-window {
      position: absolute; width: 380px; background: #C0C0C0; border: 2px solid;
      border-color: #DFDFDF #404040 #404040 #DFDFDF; box-shadow: 2px 2px 0px #000;
    }
    .win-titlebar {
      background: linear-gradient(90deg, #000080, #1084D0); color: #fff; padding: 3px 5px; font-weight: bold;
      display: flex; justify-content: space-between; align-items: center; cursor: grab;
    }
    .win-controls button {
      width: 16px; height: 14px; background: #C0C0C0; border: 1px solid; border-color: #FFF #000 #000 #FFF;
      font-weight: bold; font-size: 9px; cursor: pointer;
    }
    .win-content { padding: 12px; }

    textarea.notepad-text {
      width: 100%; height: 160px; background: #fff; border: 2px solid; border-color: #808080 #DFDFDF #DFDFDF #808080;
      padding: 6px; font-family: 'Courier New', monospace; font-size: 12px; outline: none; resize: none;
    }

    /* Taskbar */
    .taskbar {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 30px; background: #C0C0C0;
      border-top: 2px solid #DFDFDF; display: flex; justify-content: space-between; align-items: center; padding: 2px 4px;
      z-index: 1000;
    }
    .btn-start {
      background: #C0C0C0; border: 2px solid; border-color: #FFF #404040 #404040 #FFF; padding: 3px 8px;
      font-weight: bold; display: flex; align-items: center; gap: 4px; cursor: pointer;
    }
    .btn-start:active { border-color: #404040 #FFF #FFF #404040; }
    .clock-tray {
      border: 1px solid; border-color: #808080 #FFF #FFF #808080; padding: 4px 10px; background: #C0C0C0;
    }
  </style>
</head>
<body>

  <div class="desktop-icons">
    <div class="icon" onclick="openWindow('win-notepad')">
      <div class="icon-img">📝</div>
      <span>Notepad.exe</span>
    </div>
    <div class="icon" onclick="openWindow('win-music')">
      <div class="icon-img">💿</div>
      <span>CD Player</span>
    </div>
  </div>

  <!-- Notepad Window -->
  <div class="win98-window" id="win-notepad" style="top: 80px; left: 120px;">
    <div class="win-titlebar">
      <span>Notepad — README.TXT</span>
      <div class="win-controls">
        <button onclick="closeWindow('win-notepad')">✕</button>
      </div>
    </div>
    <div class="win-content">
      <textarea class="notepad-text" id="notepad-content">WELCOME TO VIBE-OS MILLENNIUM!
----------------------------------
Anti-basic web design certified.
You can type here and save notes!
----------------------------------</textarea>
      <div style="margin-top: 8px; display: flex; justify-content: flex-end;">
        <button style="padding: 4px 12px; background: #C0C0C0; border: 2px solid; border-color: #FFF #000 #000 #FFF; cursor: pointer;" onclick="saveNote()">Save Note</button>
      </div>
    </div>
  </div>

  <!-- CD Player Window -->
  <div class="win98-window" id="win-music" style="top: 140px; left: 320px;">
    <div class="win-titlebar">
      <span>VibeAMP CD Player 1.0</span>
      <div class="win-controls">
        <button onclick="closeWindow('win-music')">✕</button>
      </div>
    </div>
    <div class="win-content">
      <div id="retro-status-box" style="background: #000; color: #00FF00; padding: 10px; font-family: monospace; font-size: 14px; text-align: center; margin-bottom: 10px;">
        TRACK 01 // 03:42 [READY]
      </div>
      <div style="display: flex; gap: 8px; justify-content: center;">
        <button style="padding: 4px 10px; background: #C0C0C0; border: 2px solid; border-color: #FFF #000 #000 #FFF; cursor: pointer;" onclick="playRetroChime(330, 'Track Rewound')">◀◀</button>
        <button style="padding: 4px 10px; background: #C0C0C0; border: 2px solid; border-color: #FFF #000 #000 #FFF; cursor: pointer; font-weight: bold;" onclick="playRetroChime(440, 'Playing 8-bit Beat')">▶ PLAY</button>
        <button style="padding: 4px 10px; background: #C0C0C0; border: 2px solid; border-color: #FFF #000 #000 #FFF; cursor: pointer;" onclick="playRetroChime(220, 'Track Paused')">■ STOP</button>
      </div>
    </div>
  </div>

  <div class="taskbar">
    <div style="display: flex; align-items: center; gap: 8px;">
      <button class="btn-start" onclick="playRetroChime(523, 'VIBE-OS 1999 Edition')">
        <span>🖥️ Start</span>
      </button>
      <span style="font-family: monospace; font-size: 11px; color: #444; margin-left: 10px;">Designed by <strong>Antigravity</strong> // Google DeepMind</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="../../index.html" style="font-family: monospace; font-size: 11px; color: #000; text-decoration: none; border: 1px solid #888; padding: 2px 6px; background: #E0E0E0;">Master Hub</a>
      <div class="clock-tray" id="taskbar-clock">12:00 PM</div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('taskbar-clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function closeWindow(id) { document.getElementById(id).style.display = 'none'; }
    function openWindow(id) { document.getElementById(id).style.display = 'block'; }

    let rAudio = null;
    function playRetroChime(freq, label) {
      if (!rAudio) rAudio = new (window.AudioContext || window.webkitAudioContext)();
      if (rAudio.state === 'suspended') rAudio.resume();
      const osc = rAudio.createOscillator();
      const g = rAudio.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, rAudio.currentTime);
      g.gain.setValueAtTime(0.08, rAudio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, rAudio.currentTime + 0.18);
      osc.connect(g);
      g.connect(rAudio.destination);
      osc.start();
      osc.stop(rAudio.currentTime + 0.18);

      document.getElementById('retro-status-box').innerText = `MIDI // ${label.toUpperCase()}`;
    }

    function saveNote() {
      localStorage.setItem('vibe_os_note', document.getElementById('notepad-content').value);
      playRetroChime(660, 'File README.TXT Saved');
    }

    const saved = localStorage.getItem('vibe_os_note');
    if (saved) document.getElementById('notepad-content').value = saved;
  </script>
</body>
</html>
