<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COLOR SUITE B // Dynamic Palette Theme Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* Default: Linear Dark Craft */
    :root {
      --bg: #09090D;
      --surface: #121218;
      --text: #F4F4F8;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #FF5A1F;
      --radius: 20px;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    [data-theme="brutalist"] {
      --bg: #FFFDF8;
      --surface: #FFE600;
      --text: #000000;
      --border: 3px solid #000000;
      --accent: #FF5A5A;
      --radius: 0px;
      --shadow: 6px 6px 0px #000000;
    }

    [data-theme="luxury"] {
      --bg: #FBF9F5;
      --surface: #F2EFE9;
      --text: #1A1615;
      --border: 0.5px solid rgba(26, 22, 21, 0.2);
      --accent: #C29B38;
      --radius: 8px;
      --shadow: 0 10px 30px rgba(26, 22, 21, 0.06);
    }

    [data-theme="cyber"] {
      --bg: #040406;
      --surface: #0A0A10;
      --text: #CCFF00;
      --border: 1px solid #CCFF00;
      --accent: #00F0FF;
      --radius: 12px;
      --shadow: 0 0 25px rgba(204, 255, 0, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; transition: background 0.3s ease, color 0.3s ease, border 0.3s ease; }
    body { background: var(--bg); color: var(--text); padding: 50px 20px; min-height: 100vh; display: grid; place-items: center; }

    .showcase-card {
      background: var(--surface); border: var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 40px; max-width: 600px; width: 100%; text-align: center;
    }

    .pill-group { display: flex; justify-content: center; gap: 8px; margin-top: 28px; flex-wrap: wrap; }
    .theme-btn {
      padding: 10px 18px; border-radius: 99px; background: rgba(0,0,0,0.1); border: 1px solid currentColor;
      color: inherit; font-weight: 700; font-size: 0.8rem; cursor: pointer; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="showcase-card">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; letter-spacing: 0.15em;">PALETTE MUTATION MATRIX</span>
    <h1 style="font-size: 2.2rem; font-weight: 800; margin: 16px 0;">Instant Token Switching</h1>
    <p style="opacity: 0.8; line-height: 1.6; font-size: 0.95rem;">
      Click any theme below to witness immediate `:root` CSS custom property adaptation across surfaces, borders, shadows, and accent tokens.
    </p>

    <div class="pill-group">
      <button class="theme-btn" onclick="setTheme('')">Linear Dark</button>
      <button class="theme-btn" onclick="setTheme('brutalist')">Neo-Brutalist</button>
      <button class="theme-btn" onclick="setTheme('luxury')">Luxury Alabaster</button>
      <button class="theme-btn" onclick="setTheme('cyber')">Cyber Void</button>
    </div>
  </div>

  <script>
    function setTheme(name) {
      if (name) document.documentElement.setAttribute('data-theme', name);
      else document.documentElement.removeAttribute('data-theme');
    }
  </script>
</body>
</html>
